<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CBNU ROOM 프로토타입</title>
<link rel="icon" href="01. 심볼마크_CBNU Red_기본형.png">
<style>
  html, body { margin: 0; height: 100%; }
  body {
    background: #E9E7EA;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  /* 폰 전체를 화면 높이에 맞춰 축소 */
  #fit { transform-origin: center center; }

  .phone {
    position: relative;
    width: 390px; padding: 12px;
    border-radius: 62px;
    background: #0E0E10;
    box-shadow:
      0 0 0 2px #3A3A3E,
      0 0 0 5px #C9C9CE,
      0 0 0 6px #8E8E93,
      0 30px 80px rgba(30, 10, 20, 0.28);
  }
  /* 측면 버튼 */
  .btn { position: absolute; width: 5px; background: linear-gradient(90deg, #A9A9AE, #DADADF); border-radius: 2px; }
  .btn.action { left: -10px; top: 128px; height: 32px; }
  .btn.vol-up { left: -10px; top: 188px; height: 62px; }
  .btn.vol-dn { left: -10px; top: 264px; height: 62px; }
  .btn.power  { right: -10px; top: 210px; height: 96px; background: linear-gradient(270deg, #A9A9AE, #DADADF); }

  .screen {
    position: relative; width: 390px; height: 871px;
    border-radius: 50px; overflow: hidden; background: #FFFFFF;
  }
  /* 앱: 앱 자체 상단 여백(20px)이 상태 표시줄과 겹치도록 배치 */
  .screen iframe {
    position: absolute; left: 0; top: 27px;
    width: 390px; height: 844px; border: 0; display: block; background: #FFFFFF;
  }
  .statusbar {
    position: absolute; left: 0; right: 0; top: 0; height: 47px; z-index: 2;
    background: #FFFFFF;
    display: flex; align-items: center; justify-content: space-between;
    padding: 4px 30px 0 44px; box-sizing: border-box;
    font-size: 16px; font-weight: 600; color: #000; letter-spacing: -0.2px;
  }
  .statusbar .icons { display: flex; align-items: center; gap: 6px; }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 122px; height: 35px; border-radius: 18px; background: #000; z-index: 3;
  }
  .island::after {
    content: ""; position: absolute; right: 14px; top: 11px; width: 12px; height: 12px; border-radius: 6px;
    background: radial-gradient(circle at 40% 40%, #2B3A63 0, #0B0F1C 60%);
  }
  .home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; border-radius: 3px; background: #111; z-index: 2; pointer-events: none;
  }
  .caption { margin-top: 26px; text-align: center; font-size: 13px; color: #6B6870; }
  .caption b { color: #B92555; }

  /* 휴대폰으로 열면 프레임 없이 앱만 꽉 차게 */
  @media (max-width: 500px) {
    body { background: #FFFFFF; align-items: flex-start; }
    .phone { padding: 0; border-radius: 0; box-shadow: none; background: transparent; }
    .btn, .island, .statusbar, .home-indicator, .caption { display: none; }
    .screen { border-radius: 0; height: 844px; }
    .screen iframe { top: 0; }
  }
</style>
</head>
<body>
<div id="fit">
  <div class="phone" aria-label="iPhone 프레임">
    <span class="btn action"></span><span class="btn vol-up"></span><span class="btn vol-dn"></span><span class="btn power"></span>
    <div class="screen">
      <div class="statusbar" aria-hidden="true">
        <span>9:41</span>
        <span class="icons">
          <svg width="18" height="12" viewBox="0 0 18 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
          <svg width="16" height="12" viewBox="0 0 16 12"><path d="M8 2.5c2.3 0 4.4.9 6 2.4l1.2-1.3C13.3 1.8 10.8.8 8 .8S2.7 1.8.8 3.6L2 4.9c1.6-1.5 3.7-2.4 6-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.3C11.5 4.8 9.8 4.2 8 4.2s-3.5.6-4.8 1.8l1.2 1.3c1-.9 2.2-1.4 3.6-1.4zM8 9.3c.6 0 1.1.2 1.5.6L8 11.5 6.5 9.9c.4-.4.9-.6 1.5-.6z"/></svg>
          <svg width="27" height="13" viewBox="0 0 27 13"><rect x="0.5" y="0.5" width="23" height="12" rx="3.5" fill="none" stroke="#000" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" opacity=".5"/></svg>
        </span>
      </div>
      <div class="island"></div>
      <iframe src="app.html" title="CBNU ROOM 앱 프로토타입" scrolling="no"></iframe>
      <div class="home-indicator"></div>
    </div>
  </div>
  <p class="caption"><b>CBNU ROOM</b> · 충북대학교 양진재 기숙사 플랫폼 프로토타입</p>
</div>
<script>
  // 창 크기에 맞춰 폰 프레임을 축소(확대는 하지 않음)
  function fit() {
    var el = document.getElementById('fit');
    if (window.innerWidth <= 500) {
      var s = window.innerWidth / 390;
      el.style.transform = 'scale(' + s + ')';
      el.style.transformOrigin = 'top left';
      return;
    }
    el.style.transform = 'none';
    var r = el.getBoundingClientRect();
    var s2 = Math.min(1, (window.innerHeight - 32) / r.height, (window.innerWidth - 32) / r.width);
    el.style.transformOrigin = 'center center';
    el.style.transform = 'scale(' + s2 + ')';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('load', fit);
  fit();
</script>
</body>
</html>
