"<!DOCTYPE html>\n<html lang=\"ko\"><head>\n<meta charset=\"utf-8\">\n<title>CBNU ROOM 앱 프로토타입<\u002Ftitle>\n<script src=\"ea65c93d-3ef1-4f29-b045-1a1b4dc43b20\"><\u002Fscript>\n<meta name=\"hz:slide-selector\" content=\"[data-canvas-width]\"><meta name=\"hz:canvas-width\" content=\"390\"><meta name=\"hz:canvas-height\" content=\"844\"><\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;display=swap\">\n<style>\nbody{margin:0}\na{color:#B92555}a:hover{color:#8E1C41}\n.app *{box-sizing:border-box}\n.app button,.app select,.app input,.app textarea{font-family:inherit}\n.app button{cursor:pointer}\n.app button:disabled{cursor:default}\n.scroll{overflow-y:auto;scrollbar-width:none}\n.scroll::-webkit-scrollbar{display:none}\n.page{flex:1;min-height:0;display:flex;flex-direction:column}\n.body{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:8px 20px 20px;display:flex;flex-direction:column;gap:14px}\n.body::-webkit-scrollbar{display:none}\n.body>*{flex-shrink:0}\n.foot{padding:10px 20px 28px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}\n.card{background:#FFFFFF;border:1px solid #E8E8EA;border-radius:12px}\n.soft{background:#F7F7F9;border-radius:12px}\n.btn-primary{width:100%;height:52px;border:0;border-radius:10px;background:#B92555;color:#FFFFFF;font-size:15px;font-weight:700}\n.btn-primary:disabled{background:#E7C3CF}\n.btn-outline{width:100%;height:48px;border:1px solid #B92555;border-radius:10px;background:#FFFFFF;color:#B92555;font-size:14px;font-weight:700}\n.btn-gray{height:40px;border:0;border-radius:8px;background:#F2F2F4;color:#1F1F23;font-size:14px;font-weight:500}\n.field{width:100%;height:48px;border:1px solid #E8E8EA;border-radius:10px;background:#FFFFFF;padding:0 14px;font-size:14px;color:#1F1F23}\n.field::placeholder{color:#9A9AA2}\n.fill{background:#F5F5F7;border-color:#F0F0F2}\n.ghost{border:0;background:transparent;padding:0;color:#1F1F23}\n.key{height:54px;border:0;background:transparent;font-size:24px;color:#1F1F23}\n.key:active{background:#F5F5F7;border-radius:12px}\n.lbl{margin:0;font-size:13px;font-weight:700}\n.muted{color:#5F5F68}\n.kv{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;gap:12px}\n.kv span:first-child{color:#5F5F68}\n.kv b{text-align:right}\n.badge{font-size:11px;font-weight:700;border-radius:6px;padding:3px 8px;white-space:nowrap}\n.thumb{border-radius:10px;background:#FBEAF0;display:flex;align-items:center;justify-content:center;flex-shrink:0}\n.pill{height:34px;padding:0 14px;border-radius:17px;font-size:13px;white-space:nowrap}\n.tile{border:0;border-radius:14px;background:#F8F4F6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:700;color:#1F1F23}\n.bubble-me{align-self:flex-end;max-width:78%;background:#B92555;color:#FFFFFF;border-radius:16px 16px 4px 16px;padding:10px 14px;font-size:13px;line-height:1.5}\n.bubble-other{max-width:78%;background:#F5F5F7;color:#1F1F23;border-radius:16px 16px 16px 4px;padding:10px 14px;font-size:13px;line-height:1.5}\n.avatar{width:36px;height:36px;border-radius:18px;background:#FBEAF0;display:flex;align-items:center;justify-content:center;flex-shrink:0}\n@keyframes marquee{from{transform:translateX(100%)}to{transform:translateX(-100%)}}\n.marquee span{display:inline-block;white-space:nowrap;animation:marquee 9s linear infinite}\n@keyframes slideIn{from{transform:translateX(100%)}to{transform:translateX(0)}}\n@keyframes fadeIn{from{opacity:0}to{opacity:1}}\n.modal-bg{position:absolute;inset:0;background:rgba(20,20,24,0.5);display:flex;align-items:center;justify-content:center;padding:24px}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div class=\"app\" style=\"width: 390px; height: 844px; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Noto Sans KR', system-ui, sans-serif; color: #1F1F23; display: flex; flex-direction: column\" data-canvas-width=\"390\" data-canvas-height=\"844\" data-document-role=\"page\" data-label=\"CBNU ROOM 앱\">\n\n<!-- ================= 로그인 ================= -->\n<sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ true }}\">\n<div class=\"page\" style=\"padding: 64px 20px 32px\">\n<img src=\"666334a3-a997-4b43-ac0f-8444a83440e0\" alt=\"충북대학교 로고\" style=\"width: 44px; height: 53px; object-fit: contain; object-position: left\">\n<h1 style=\"margin: 16px 0 0; font-size: 30px; font-weight: 700; letter-spacing: -0.5px\">CBNU ROOM<\u002Fh1>\n<p style=\"margin: 10px 0 0; font-size: 13px; color: #5F5F68\">충북대학교 기숙사 플랫폼<\u002Fp>\n<p style=\"margin: 10px 0 0; font-size: 21px; font-weight: 700; letter-spacing: -0.4px\">기숙사의 모든 생활을 한 곳에서.<\u002Fp>\n<div style=\"margin-top: 40px; display: flex; flex-direction: column; gap: 8px\">\n<label for=\"loginId\" class=\"lbl\">개신누리 ID<\u002Flabel>\n<input id=\"loginId\" class=\"field fill\" type=\"text\" placeholder=\"개신누리 ID를 입력해 주세요\">\n<\u002Fdiv>\n<div style=\"margin-top: 20px; display: flex; flex-direction: column; gap: 8px\">\n<label for=\"loginPw\" class=\"lbl\">비밀번호<\u002Flabel>\n<input id=\"loginPw\" class=\"field fill\" type=\"password\" placeholder=\"비밀번호를 입력해 주세요\">\n<\u002Fdiv>\n<p style=\"margin: 12px 0 0; display: flex; align-items: center; gap: 6px; font-size: 11px; color: #5F5F68\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5F5F68\" stroke-width=\"2\" aria-hidden=\"true\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"10\" rx=\"2\"><\u002Frect><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"><\u002Fpath><\u002Fsvg>개신누리 계정으로 기숙사 생활을 시작해요.<\u002Fp>\n<div style=\"flex: 1\"><\u002Fdiv>\n<button class=\"btn-primary\" type=\"button\" sc-camel-on-click=\"{{ goCharge }}\">시작하기<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- ================= 공통: 서브 헤더 ================= -->\n<sc-if value=\"{{ showSub }}\" hint-placeholder-val=\"{{ fals
